name: Native registries
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        type: choice
        default: full
        options:
          - full
          - browser-contracts
permissions:
  contents: read
jobs:
  check:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'browser-contracts' && 'browser-contracts' || 'check' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run reference:setup
      - run: bunx --no-install agent-browser install --with-deps
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: app
      - run: bun run check
        if: github.event_name != 'workflow_dispatch' || inputs.scope != 'browser-contracts'
      - run: |
          bun run build
          bun run --cwd app test:e2e test/tailwind-fluid-contracts.e2e.ts test/tooltip-contracts.e2e.ts
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'browser-contracts'
      - run: bun run test:consumer
        if: github.event_name != 'workflow_dispatch' || inputs.scope != 'browser-contracts'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registries-and-native-showcase
          path: |
            public
            app/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consumer-verification
          include-hidden-files: true
          path: |
            .verification/showcase-results
            .verification/showcase-tests.json
            .verification/consumer.json
            .verification/consumer.png
